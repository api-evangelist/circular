name: Circular
description: >-
  Circular was a Spanish hiring community that connected tech recruiters with software
  developers, describing itself as a "Hiring Community for Tech Recruiters & Developers."
  It operated a referral-driven talent network in which recruiters shared vetted candidates
  they could not place themselves, and developers received job opportunities through that
  trusted pool rather than through cold outreach. The company was backed by Point Nine
  Capital and ran its candidate and recruiter landing experiences on a Next.js application
  served from circular.io and static.circular.io. Circular has since shut down and merged
  into Manfred (getmanfred.com), the largest tech community in Spain, with its own migration
  notice stating "Circular cierra sus puertas para integrarse en Manfred." The circular.io
  domain remains registered to Singular People Europe S.L. but has been fully undelegated,
  and Point Nine no longer lists Circular in its portfolio. Circular never published a public
  developer program, API, SDK, or specification. This profile is retained as a historical
  record; there is no API surface to enrich.
